<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>บัญชีผู้ใช้ โรงเรียนปากช่อง</title>
  <!--
    หน้าครอบของ "บัญชีผู้ใช้ โรงเรียนปากช่อง" — วางที่ pcschool-dev.github.io/account/index.html
    ทำไมต้องมีหน้านี้: ปุ่ม Google ใช้ได้เฉพาะโดเมนที่ลงทะเบียนไว้กับ Client ID (https://pcschool-dev.github.io)
    กรอบของ Apps Script ลงทะเบียนไม่ได้ ปุ่มจึงอยู่ที่หน้านี้แล้ววางทับช่องในแอปตามพิกัดที่แอปส่งมา
    และหน้านี้ส่งพารามิเตอร์ทั้งหมด (?from= ?u= ?v= ?code= ?state=) ต่อให้แอป — ลิงก์อีเมลและ LINE จึงกลับมาที่หน้านี้ได้
    ค่าเดียวที่ต้องแก้: EXEC_URL = URL /exec ของระบบกลางหลัง deploy
  -->
  <script src="https://accounts.google.com/gsi/client" async onload="window.gReady && window.gReady()"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #f3f6fb; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #gfloat { display: none; position: fixed; z-index: 5; align-items: center; justify-content: center; background: #fff; border-radius: 999px; }
    #gfloat.on { display: flex; }
    #gfb { width: 100%; height: 40px; border: 1px solid #dadce0; border-radius: 999px; background: #fff; color: #3c4043;
      font: 500 14px/1 'Sarabun', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
    #gfb .gfb-g { font-weight: 700; color: #4285f4; font-size: 16px; }
  </style>
</head>
<body>
  <iframe id="app" title="บัญชีผู้ใช้ โรงเรียนปากช่อง" allow="clipboard-write"></iframe>
  <div id="gfloat" role="region" aria-label="ยืนยันตัวตนด้วย Google"><div id="gbtn"></div><button type="button" id="gfb" style="display:none"></button></div>
  <script>
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycby_1PlF-C7Zr9m6tCrAMReA3JwGqveC1G62ip_1oeO70Kb16yc1anCmIVHZkuRe5vjB/exec';
    var link = document.getElementById('app');
    // ส่งทุกพารามิเตอร์ต่อให้แอป (ลิงก์จากอีเมล ?v= และที่ LINE พากลับ ?code=&state= มาที่หน้านี้)
    link.src = EXEC_URL + (location.search || '');

    /* ---- ปุ่ม Google: ชุดเดียวกับหน้าครอบของระบบอื่น (skill pcschool-google-login / wrapper-snippet) ---- */
    var GOOGLE_CLIENT_ID = '557466410691-3h5k0b5mdoan0p8ojrfbpvbs8icgi6q2.apps.googleusercontent.com';
    var gApp = null, gOrigin = '', gInit = false, gWant = false, gNoAuto = false;
    var gRect = null, gBtnW = 0;
    var gFloat = document.getElementById('gfloat');
    function gReadyNow() { return !!(window.google && google.accounts && google.accounts.id); }
    function gInitOnce() {
      if (gInit || !gReadyNow()) return gInit;
      gInit = true;
      // ไม่เปิดเข้าเองอัตโนมัติ — หน้านี้คือการกู้รหัส ผู้ใช้ต้องเลือกบัญชีเองทุกครั้ง (เครื่องส่วนกลางในห้องคอม)
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: gCallback, auto_select: false,
        hd: 'pcschool.ac.th', context: 'use', ux_mode: 'popup', cancel_on_tap_outside: false });
      return true;
    }
    var gInApp = /\bLine\/|FBAN|FBAV|Instagram/i.test(navigator.userAgent);
    var gFbTimer = 0;
    function gFallback(kind) {
      var fb = document.getElementById('gfb'), btn = document.getElementById('gbtn');
      if (!kind) { fb.style.display = 'none'; btn.style.display = ''; return; }
      btn.style.display = 'none'; fb.style.display = 'flex';
      if (kind === 'open') {
        fb.innerHTML = '<span class="gfb-g">G</span>เปิดในเบราว์เซอร์เพื่อใช้ Google';
        fb.onclick = function () { var u = new URL(location.href); u.searchParams.set('openExternalBrowser', '1'); location.href = u.toString(); };
      } else {
        fb.innerHTML = '<span class="gfb-g">G</span>ยืนยันตัวตนด้วย Google';
        fb.onclick = function () { if (gReadyNow()) google.accounts.id.prompt(); else location.reload(); };
      }
    }
    function gPlace() {
      if (!gWant || !gRect) { gFloat.classList.remove('on'); return; }
      var fr = link.getBoundingClientRect();
      gFloat.style.left = (fr.left + gRect.x) + 'px'; gFloat.style.top = (fr.top + gRect.y) + 'px';
      gFloat.style.width = gRect.w + 'px'; gFloat.style.height = gRect.h + 'px';
      gFloat.classList.add('on');
      if (gInApp) { gFallback('open'); return; }
      if (!gInitOnce()) {
        clearTimeout(gFbTimer);
        gFbTimer = setTimeout(function () { if (gWant && !gInitOnce()) gFallback('prompt'); }, 4000);
        return;
      }
      var w = Math.max(200, Math.min(400, Math.floor(gRect.w)));
      if (Math.abs(w - gBtnW) > 4) {
        gBtnW = w; gFallback('');
        google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'outline', size: 'large',
          text: 'continue_with', shape: 'pill', locale: 'th', width: w });
        clearTimeout(gFbTimer);
        gFbTimer = setTimeout(function () {
          if (gWant && !(document.getElementById('gbtn').getBoundingClientRect().height > 10)) gFallback('prompt');
        }, 3000);
      }
    }
    window.gReady = gPlace;
    window.addEventListener('resize', gPlace);
    function gCallback(resp) {
      if (!resp || !resp.credential || !gApp) return;
      gRect = null; gFloat.classList.remove('on');
      gApp.postMessage({ tes: 'gcred', credential: resp.credential, selectBy: String(resp.select_by || '') }, gOrigin);
    }
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || (d.tes !== 'auth' && d.tes !== 'gslot') || !/\.googleusercontent\.com$/.test(String(ev.origin))) return;
      gApp = ev.source; gOrigin = ev.origin;
      if (d.tes === 'gslot') { gRect = d.rect || null; gPlace(); return; }
      if (d.state === 'login') {
        gWant = true;
        try { gApp.postMessage({ tes: 'gwrap' }, gOrigin); } catch (e) { }
        gPlace();
      } else {
        gWant = false; gRect = null; gBtnW = 0;
        gFloat.classList.remove('on');
        try { google.accounts.id.cancel(); } catch (e) { }
        if (d.state === 'logout') { gNoAuto = true; try { google.accounts.id.disableAutoSelect(); } catch (e) { } }
      }
    });
  </script>
</body>
</html>
